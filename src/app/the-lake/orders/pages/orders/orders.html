<section class="mx-auto max-w-7xl">
  <div class="page-header">
    <div>
      <h1 class="page-title">Pedidos</h1>
      <p class="page-subtitle">Consulta y gestiona los pedidos recibidos en THE LAKE.</p>
    </div>
  </div>

  @if (error()) {
    <div
      class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      role="alert"
    >
      {{ error() }}
    </div>
  }

  <div class="mt-6 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <h2 class="text-sm font-semibold text-slate-900">Filtros</h2>
      @if (hasActiveFilters()) {
        <button
          type="button"
          (click)="clearFilters()"
          class="text-sm font-medium text-slate-600 transition hover:text-slate-900"
        >
          Limpiar filtros
        </button>
      }
    </div>

    <div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
      <div>
        <label for="order-customer-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Cliente
        </label>
        <input
          id="order-customer-filter"
          type="search"
          [value]="customerFilter()"
          (input)="onCustomerFilterChange($event)"
          placeholder="Buscar por cliente"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        />
      </div>

      <div>
        <label for="order-email-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Email
        </label>
        <input
          id="order-email-filter"
          type="search"
          [value]="emailFilter()"
          (input)="onEmailFilterChange($event)"
          placeholder="Buscar por email"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        />
      </div>

      <div>
        <label for="order-phone-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Teléfono
        </label>
        <input
          id="order-phone-filter"
          type="search"
          [value]="phoneFilter()"
          (input)="onPhoneFilterChange($event)"
          placeholder="Buscar por teléfono"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        />
      </div>

      <div>
        <label for="order-status-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Estado
        </label>
        <select
          id="order-status-filter"
          [value]="statusFilter()"
          (change)="onStatusFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          @for (option of statusFilterOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div>
        <label for="order-date-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Fecha
        </label>
        <input
          id="order-date-filter"
          type="date"
          [value]="dateFilter()"
          (change)="onDateFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        />
      </div>
    </div>
  </div>

  <div class="mt-6">
    <app-data-table
      [columns]="tableColumns()"
      [rows]="filteredOrders()"
      [loading]="loading()"
      loadingMessage="Cargando pedidos..."
      [emptyMessage]="
        hasActiveFilters()
          ? 'No hay pedidos que coincidan con los filtros.'
          : 'No hay pedidos registrados.'
      "
      [trackBy]="trackOrder"
      (edit)="openDetail($event)"
      (delete)="deleteOrder($event)"
    />
  </div>
</section>

@if (showDetail() && selectedOrder()) {
  <app-order-detail-dialog
    [order]="selectedOrder()!"
    (submitted)="onOrderSubmitted($event)"
    (cancelled)="closeDetail()"
  />
}
