<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="isEditing ? 'Editar suscripción' : 'Agregar suscripción'"
>
  <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl">
    <h2 class="text-lg font-semibold text-slate-900">
      {{ isEditing ? 'Editar suscripción' : 'Agregar suscripción' }}
    </h2>

    <form class="mt-4 space-y-4" [formGroup]="form" (submit)="onSubmit($event)">
      @if (showValidationSummary()) {
        <div
          class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-900"
          role="alert"
        >
          Revisa el formulario: el email es obligatorio y debe ser válido.
        </div>
      }

      <div>
        <label for="subscription-email" class="block text-sm font-medium text-slate-700">
          Email
        </label>
        <input
          id="subscription-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 accent-focus"
          [class.border-red-400]="fieldError('email')"
        />
        @if (fieldError('email'); as error) {
          <p class="mt-1.5 text-xs text-red-600">{{ error }}</p>
        }
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="onCancel()" class="btn-secondary px-4 py-2">
          Cancelar
        </button>
        <button type="submit" class="btn-primary px-4 py-2">
          {{ isEditing ? 'Guardar cambios' : 'Agregar suscripción' }}
        </button>
      </div>
    </form>
  </div>
</div>
