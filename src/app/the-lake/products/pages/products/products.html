<section class="mx-auto max-w-7xl">
  <div class="page-header">
    <div>
      <h1 class="page-title">Productos</h1>
      <p class="page-subtitle">Gestiona el catálogo de productos de THE LAKE.</p>
    </div>

    <button type="button" (click)="openAddForm()" class="btn-primary">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"
        />
      </svg>
      Agregar producto
    </button>
  </div>

  @if (error()) {
    <div
      class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      role="alert"
    >
      {{ error() }}
    </div>
  }

  <div class="mt-6 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <h2 class="text-sm font-semibold text-slate-900">Filtros</h2>
      @if (hasActiveFilters()) {
        <button
          type="button"
          (click)="clearFilters()"
          class="text-sm font-medium text-slate-600 transition hover:text-slate-900"
        >
          Limpiar filtros
        </button>
      }
    </div>

    <div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
      <div>
        <label for="product-name-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Nombre
        </label>
        <input
          id="product-name-filter"
          type="search"
          [value]="nameFilter()"
          (input)="onNameFilterChange($event)"
          placeholder="Buscar por nombre"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        />
      </div>

      <div>
        <label for="product-brand-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Marca
        </label>
        <select
          id="product-brand-filter"
          [value]="brandFilter()"
          (change)="onBrandFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          <option value="all">Todas</option>
          @for (brand of brands(); track brand.uuid) {
            <option [value]="brand.uuid">{{ brand.name }}</option>
          }
        </select>
      </div>

      <div>
        <label for="product-category-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Categoría
        </label>
        <select
          id="product-category-filter"
          [value]="categoryFilter()"
          (change)="onCategoryFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          @for (option of categoryFilterOptions(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div>
        <label for="product-offer-filter" class="mb-1 block text-xs font-medium text-slate-600">
          En oferta
        </label>
        <select
          id="product-offer-filter"
          [value]="offerFilter()"
          (change)="onOfferFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          @for (option of triFilterOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div>
        <label for="product-featured-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Destacado
        </label>
        <select
          id="product-featured-filter"
          [value]="featuredFilter()"
          (change)="onFeaturedFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          @for (option of triFilterOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="mt-6">
    <app-data-table
      [columns]="tableColumns()"
      [rows]="filteredProducts()"
      [loading]="loading()"
      loadingMessage="Cargando productos..."
      [emptyMessage]="
        hasActiveFilters()
          ? 'No hay productos que coincidan con los filtros.'
          : 'No hay productos registrados.'
      "
      [trackBy]="trackProduct"
      [showPrintLabel]="true"
      (edit)="openEditForm($event)"
      (printLabel)="openPrintLabelDialog($event)"
      (delete)="deleteProduct($event)"
    />
  </div>
</section>

@if (showForm()) {
  <app-product-form-dialog
    [product]="editingProduct()"
    [brands]="brands()"
    [categories]="categories()"
    (submitted)="onProductSubmitted($event)"
    (cancelled)="closeForm()"
  />
}

@if (showPrintLabelDialog() && printingProduct()) {
  <app-print-label-dialog
    [product]="printingProduct()!"
    [printing]="printingLabel()"
    (confirmed)="onPrintLabelConfirmed($event)"
    (cancelled)="closePrintLabelDialog()"
  />
}
