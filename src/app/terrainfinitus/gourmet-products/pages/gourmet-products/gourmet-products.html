<section class="mx-auto max-w-7xl">
  <div class="page-header">
    <div>
      <h1 class="page-title">Productos gourmet</h1>
      <p class="page-subtitle">Gestiona el catálogo gourmet de TERRAINFINITUS.</p>
    </div>

    <button type="button" (click)="openAddForm()" class="btn-primary">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"
        />
      </svg>
      Agregar producto
    </button>
  </div>

  @if (error()) {
    <div
      class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      role="alert"
    >
      {{ error() }}
    </div>
  }

  <div class="mt-6 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <h2 class="text-sm font-semibold text-slate-900">Filtros</h2>
      @if (hasActiveFilters()) {
        <button
          type="button"
          (click)="clearFilters()"
          class="text-sm font-medium text-slate-600 transition hover:text-slate-900"
        >
          Limpiar filtros
        </button>
      }
    </div>

    <div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      <div>
        <label for="gourmet-name-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Nombre
        </label>
        <input
          id="gourmet-name-filter"
          type="search"
          [value]="nameFilter()"
          (input)="onNameFilterChange($event)"
          placeholder="Nombre, slug o key"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        />
      </div>

      <div>
        <label for="gourmet-category-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Categoría
        </label>
        <select
          id="gourmet-category-filter"
          [value]="categoryFilter()"
          (change)="onCategoryFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          @for (option of categoryFilterOptions(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div>
        <label for="gourmet-section-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Sección
        </label>
        <select
          id="gourmet-section-filter"
          [value]="sectionFilter()"
          (change)="onSectionFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          @for (option of sectionFilterOptions(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div>
        <label for="gourmet-active-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Activo
        </label>
        <select
          id="gourmet-active-filter"
          [value]="activeFilter()"
          (change)="onActiveFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          @for (option of activeFilterOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="mt-6">
    <app-data-table
      [columns]="tableColumns()"
      [rows]="filteredProducts()"
      [loading]="loading()"
      loadingMessage="Cargando productos gourmet..."
      [emptyMessage]="
        hasActiveFilters()
          ? 'No hay productos gourmet que coincidan con los filtros.'
          : 'No hay productos gourmet registrados.'
      "
      [trackBy]="trackProduct"
      (edit)="openEditForm($event)"
      (delete)="deleteProduct($event)"
    />
  </div>
</section>

@if (showForm()) {
  <app-gourmet-product-form-dialog
    [product]="editingProduct()"
    (submitted)="onProductSubmitted($event)"
    (cancelled)="closeForm()"
  />
}
