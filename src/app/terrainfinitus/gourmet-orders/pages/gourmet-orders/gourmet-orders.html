<section class="mx-auto max-w-7xl">
  <div class="page-header">
    <div>
      <h1 class="page-title">Pedidos gourmet</h1>
      <p class="page-subtitle">Gestiona los pedidos gourmet de los clientes en TERRAINFINITUS.</p>
    </div>

    <button type="button" (click)="openAddForm()" class="btn-primary">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"
        />
      </svg>
      Agregar pedido
    </button>
  </div>

  @if (error()) {
    <div
      class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      role="alert"
    >
      {{ error() }}
    </div>
  }

  <div class="mt-6 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <h2 class="text-sm font-semibold text-slate-900">Filtros</h2>
      @if (hasActiveFilters()) {
        <button
          type="button"
          (click)="clearFilters()"
          class="text-sm font-medium text-slate-600 transition hover:text-slate-900"
        >
          Limpiar filtros
        </button>
      }
    </div>

    <div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <div>
        <label for="gourmet-order-user-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Usuario
        </label>
        <input
          id="gourmet-order-user-filter"
          type="search"
          [value]="userFilter()"
          (input)="onUserFilterChange($event)"
          placeholder="ID usuario"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        />
      </div>

      <div>
        <label for="gourmet-order-status-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Estado
        </label>
        <select
          id="gourmet-order-status-filter"
          [value]="statusFilter()"
          (change)="onStatusFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        >
          @for (option of statusFilterOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div>
        <label for="gourmet-order-date-filter" class="mb-1 block text-xs font-medium text-slate-600">
          Fecha
        </label>
        <input
          id="gourmet-order-date-filter"
          type="date"
          [value]="dateFilter()"
          (change)="onDateFilterChange($event)"
          class="filter-select w-full rounded-lg px-3 py-2 text-sm accent-focus"
        />
      </div>
    </div>
  </div>

  <div class="mt-6">
    <app-data-table
      [columns]="tableColumns()"
      [rows]="filteredOrders()"
      [loading]="loading()"
      loadingMessage="Cargando pedidos gourmet..."
      [emptyMessage]="
        hasActiveFilters()
          ? 'No hay pedidos gourmet que coincidan con los filtros.'
          : 'No hay pedidos gourmet registrados.'
      "
      [trackBy]="trackOrder"
      (edit)="openEditForm($event)"
      (delete)="deleteOrder($event)"
    />
  </div>
</section>

@if (showForm()) {
  <app-gourmet-order-form-dialog
    [order]="editingOrder()"
    [products]="products()"
    (submitted)="onOrderSubmitted($event)"
    (cancelled)="closeForm()"
  />
}
